<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wheel of gift 💕</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #3b0a1a, #5c0f2b 40%, #2a0a1a);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    gap: 24px;
  }
  h1 {
    margin: 0;
    font-size: 32px;
    text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
  }
  .wheel-wrap {
    position: relative;
    width: 400px;
    height: 400px;
  }
  #wheelCanvas {
    border-radius: 50%;
    box-shadow: 0 0 0 10px #7a1436, 0 0 40px rgba(255, 20, 90, 0.5);
    transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid #ff4d6d;
    z-index: 5;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
  }
  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 46px;
    height: 46px;
    background: #ff4d6d;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 12px rgba(255, 77, 109, 0.8);
    z-index: 4;
  }
  #spinBtn {
    padding: 14px 40px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 77, 109, 0.6);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  #spinBtn:hover { background: #ff6b87; }
  #spinBtn:active { transform: scale(0.96); }
  #spinBtn:disabled {
    background: #7a5560;
    color: #ddd;
    cursor: not-allowed;
    box-shadow: none;
  }
  #result {
    font-size: 22px;
    font-weight: bold;
    min-height: 30px;
    color: #ffb3c6;
    text-shadow: 0 0 8px rgba(255, 105, 180, 0.6);
  }

  /* ---- Result overlay & animations ---- */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }
  .result-card {
    position: relative;
    text-align: center;
    padding: 26px 46px;
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(90,10,40,0.85), rgba(40,5,20,0.9));
    border: 1px solid rgba(255,179,198,0.5);
    box-shadow: 0 0 50px rgba(255, 77, 109, 0.55);
    animation: cardPop 0.7s cubic-bezier(.24,1.4,.4,1) forwards;
    opacity: 0;
  }
  @keyframes cardPop {
    0% { transform: scale(0.3) translateY(30px); opacity: 0; }
    60% { transform: scale(1.08) translateY(-6px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .result-title {
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ff8fa3;
    margin-bottom: 6px;
    animation: fadeSlide 0.5s ease 0.15s both;
  }
  .result-label {
    font-size: 32px;
    font-weight: bold;
    color: #ffe6ec;
    text-shadow: 0 0 18px rgba(255, 143, 163, 0.9);
    animation: fadeSlide 0.5s ease 0.25s both, glowPulse 1.6s ease-in-out 0.8s infinite;
  }
  @keyframes fadeSlide {
    0% { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 18px rgba(255, 143, 163, 0.9); }
    50% { text-shadow: 0 0 32px rgba(255, 143, 163, 1), 0 0 50px rgba(255, 77, 109, 0.8); }
  }

  /* Kiss animation pieces */
  .kiss-float {
    position: absolute;
    bottom: -20px;
    font-size: 26px;
    opacity: 0;
    animation: kissRise 2.2s ease-in forwards;
  }
  @keyframes kissRise {
    0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(-600px) scale(1.2) rotate(25deg); opacity: 0; }
  }
  .lip-mark {
    position: absolute;
    font-size: 46px;
    opacity: 0;
    animation: lipPop 1s ease-out forwards;
  }
  @keyframes lipPop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    50% { transform: scale(1.3) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
  }

  /* Congrats animation pieces */
  .glow-ring {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid #ffb3c6;
    animation: ringExpand 1.2s ease-out forwards;
  }
  @keyframes ringExpand {
    0% { width: 20px; height: 20px; opacity: 0.9; }
    100% { width: 700px; height: 700px; opacity: 0; }
  }
  .confetti {
    position: absolute;
    top: -30px;
    width: 9px;
    height: 15px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(720px) rotate(540deg); opacity: 0; }
  }
  .spark {
    position: absolute;
    font-size: 22px;
    opacity: 0;
    animation: sparkPop 1.4s ease-out forwards;
  }
  @keyframes sparkPop {
    0% { transform: scale(0) rotate(0deg); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: scale(1.3) rotate(200deg) translateY(-40px); opacity: 0; }
  }
</style>
</head>
<body>

<h1>💖 Wheel of Gift 💖</h1>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheelCanvas" width="400" height="400"></canvas>
  <div class="hub">💕</div>
</div>

<button id="spinBtn">SPIN</button>
<div id="result"></div>
<div id="overlay"></div>

<script>
  // Same 13 options as before, unchanged
  const segments = [
    "Teddy",
    "Perfume",
    "Emergency Light",
    "Watch",
    "Keychain",
    "Water color",
    "Heating pad",
    "Lamp",
    "Water bottle",
    "phone stand",
    "Try again",
    "kiss"
  ];

  // Romantic pink / red / rose gold palette
  const colors = [
    "#ff4d6d", "#c9184a", "#ff8fa3", "#a4133c",
    "#ff758f", "#800f2f", "#ffb3c6", "#e5383b",
    "#ff85a1", "#590d22", "#ffccd5", "#d00000"
  ];

  // How much more likely "kiss" is to be picked compared to every other option.
  // 1 = same chance as the rest, 6 = six times more likely, etc.
  const KISS_WEIGHT_MULTIPLIER = 8;

  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinBtn");
  const resultEl = document.getElementById("result");
  const overlay = document.getElementById("overlay");

  const numSegments = segments.length;
  const arc = (2 * Math.PI) / numSegments;
  const radius = canvas.width / 2;

  function drawWheel() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < numSegments; i++) {
      const startAngle = i * arc;
      const endAngle = startAngle + arc;

      ctx.beginPath();
      ctx.moveTo(radius, radius);
      ctx.arc(radius, radius, radius, startAngle, endAngle);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = "#3b0a1a";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw text
      ctx.save();
      ctx.translate(radius, radius);
      ctx.rotate(startAngle + arc / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#fff";
      ctx.font = "bold 14px 'Segoe UI', Arial";
      ctx.shadowColor = "rgba(0,0,0,0.5)";
      ctx.shadowBlur = 3;
      ctx.fillText(segments[i], radius - 18, 5);
      ctx.restore();
    }
  }

  drawWheel();

  let currentRotation = 0;
  let isSpinning = false;

  // Weighted random pick: the wheel still has 13 equal-sized visual slices,
  // but "kiss" is far more likely to be the one actually chosen and landed on.
  function pickWeightedIndex() {
    const weights = segments.map(s =>
      s.toLowerCase() === "kiss" ? KISS_WEIGHT_MULTIPLIER : 1
    );
    const totalWeight = weights.reduce((sum, w) => sum + w, 0);

    let r = Math.random() * totalWeight;
    for (let i = 0; i < segments.length; i++) {
      r -= weights[i];
      if (r <= 0) return i;
    }
    return segments.length - 1; // fallback, should not normally hit
  }

  function clearOverlay() {
    overlay.innerHTML = "";
  }

  function playKissAnimation(label) {
    clearOverlay();

    // Big lip marks popping around the card
    const lipCount = 6;
    for (let i = 0; i < lipCount; i++) {
      const lip = document.createElement("div");
      lip.className = "lip-mark";
      lip.textContent = "💋";
      const angle = (i / lipCount) * 360;
      const dist = 100 + Math.random() * 50;
      const x = Math.cos(angle * Math.PI / 180) * dist;
      const y = Math.sin(angle * Math.PI / 180) * dist;
      lip.style.left = `calc(50% + ${x}px)`;
      lip.style.top = `calc(50% + ${y}px)`;
      lip.style.animationDelay = (Math.random() * 0.3) + "s";
      overlay.appendChild(lip);
    }

    // Kisses and hearts floating up from the bottom
    const kissEmojis = ["💋", "💖", "💕", "😘"];
    for (let i = 0; i < 16; i++) {
      const el = document.createElement("div");
      el.className = "kiss-float";
      el.textContent = kissEmojis[Math.floor(Math.random() * kissEmojis.length)];
      el.style.left = (5 + Math.random() * 90) + "%";
      el.style.animationDelay = (Math.random() * 0.8) + "s";
      overlay.appendChild(el);
    }

    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `
      <div class="result-title">You landed on</div>
      <div class="result-label">💋 ${label} 💋</div>
    `;
    overlay.appendChild(card);

    setTimeout(clearOverlay, 2600);
  }

  function playCongratsAnimation(label) {
    clearOverlay();

    const ring = document.createElement("div");
    ring.className = "glow-ring";
    overlay.appendChild(ring);

    const confettiColors = ["#ff4d6d", "#ffd166", "#ffb3c6", "#ff8fa3", "#fff", "#ff85a1"];
    for (let i = 0; i < 60; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti";
      piece.style.left = Math.random() * 100 + "%";
      piece.style.background = confettiColors[Math.floor(Math.random() * confettiColors.length)];
      piece.style.animationDelay = (Math.random() * 0.7) + "s";
      piece.style.animationDuration = (1.6 + Math.random() * 1) + "s";
      piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
      overlay.appendChild(piece);
    }

    const sparkEmojis = ["✨", "🌟", "💫"];
    for (let i = 0; i < 10; i++) {
      const spark = document.createElement("div");
      spark.className = "spark";
      spark.textContent = sparkEmojis[Math.floor(Math.random() * sparkEmojis.length)];
      const angle = (i / 10) * 360;
      const dist = 90 + Math.random() * 60;
      const x = Math.cos(angle * Math.PI / 180) * dist;
      const y = Math.sin(angle * Math.PI / 180) * dist;
      spark.style.left = `calc(50% + ${x}px)`;
      spark.style.top = `calc(50% + ${y}px)`;
      spark.style.animationDelay = (0.2 + Math.random() * 0.3) + "s";
      overlay.appendChild(spark);
    }

    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `
      <div class="result-title">Congratulations! You won</div>
      <div class="result-label">🎉 ${label} 🎉</div>
    `;
    overlay.appendChild(card);

    setTimeout(clearOverlay, 2800);
  }

  spinBtn.addEventListener("click", () => {
    if (isSpinning) return;
    isSpinning = true;
    resultEl.textContent = "";
    spinBtn.disabled = true;

    // Weighted pick instead of plain Math.random() * numSegments
    const winningIndex = pickWeightedIndex();

    const segmentDeg = 360 / numSegments;
    const segmentMiddleDeg = winningIndex * segmentDeg + segmentDeg / 2;

    // The angle (0-360) the wheel needs to end up resting at so the winning
    // segment's middle sits under the pointer at the top.
    const desiredRestAngle = ((270 - segmentMiddleDeg) % 360 + 360) % 360;

    // Where the wheel is actually resting right now (currentRotation keeps
    // growing every spin, so we compare against its value mod 360, not 0).
    const currentRestAngle = ((currentRotation % 360) + 360) % 360;

    // How far to rotate from the current resting angle to the desired one,
    // always moving forward (0-360), plus a few extra full spins for effect.
    let delta = desiredRestAngle - currentRestAngle;
    if (delta < 0) delta += 360;

    const extraSpins = 6;
    const targetRotation = extraSpins * 360 + delta;

    currentRotation += targetRotation;
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      isSpinning = false;
      spinBtn.disabled = false;
      const winningLabel = segments[winningIndex];
      resultEl.textContent = "💘 Result: " + winningLabel;

      if (winningLabel.toLowerCase() === "kiss") {
        playKissAnimation(winningLabel);
      } else {
        playCongratsAnimation(winningLabel);
      }
    }, 5000);
  });
</script>

</body>
</html>
